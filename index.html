<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#0a0a1a" />
<meta name="description" content="Neon Arena — a fast-paced top-down arcade shooter. Survive waves, collect coins, unlock weapons." />
<title>Neon Arena — Arcade Shooter</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='42' fill='%230a0a1a'/%3E%3Cpath d='M50 18 L72 62 L50 52 L28 62 Z' fill='%234dc9ff'/%3E%3Ccircle cx='50' cy='46' r='8' fill='%23fff'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div id="game-container">
  <div id="stage">
    <canvas id="game"></canvas>

    <!-- ============ HUD ============ -->
    <div id="hud" class="hidden">
      <div class="hud-top-left">
        <div class="hp-wrap">
          <svg class="ic" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
          <div class="hp-bar"><div id="hp-fill"></div><span id="hp-text">100</span></div>
        </div>
        <div id="shield-ind" class="power-chip hidden" style="--pc:#6bcb77">
          <svg class="ic" viewBox="0 0 24 24"><path d="M12 2l8 3v6c0 5-3.5 9.3-8 11-4.5-1.7-8-6-8-11V5l8-3z" fill="currentColor"/></svg>
          <span>SHIELD</span><i id="shield-t"></i>
        </div>
      </div>

      <div class="hud-top-center">
        <div id="hud-score">0</div>
        <div id="hud-wave">WAVE 1</div>
      </div>

      <div class="hud-top-right">
        <div class="hud-pill">
          <svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#ffd93d" stroke="#c77e00" stroke-width="2"/><path d="M12 7.2l1.35 2.85 3.1.4-2.25 2.15.55 3.05L12 14.2l-2.75 1.45.55-3.05-2.25-2.15 3.1-.4z" fill="#c77e00"/></svg>
          <span id="hud-coins">0</span>
        </div>
        <button class="icon-btn" id="btn-pause" aria-label="Pause">
          <svg class="ic" viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1.2" fill="currentColor"/><rect x="14" y="5" width="4" height="14" rx="1.2" fill="currentColor"/></svg>
        </button>
        <button class="icon-btn" id="btn-sound-hud" aria-label="Toggle sound">
          <svg class="ic ic-on" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3z" fill="currentColor"/><path d="M16 8.5a4.5 4.5 0 010 7M18.5 6a8 8 0 010 12" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
          <svg class="ic ic-off" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3z" fill="currentColor"/><path d="M16 9l6 6M22 9l-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
      </div>

      <div class="hud-bottom-left" id="powerup-bar"></div>

      <div class="hud-bottom-right">
        <div id="weapon-slots"></div>
        <div class="cooldown-wrap">
          <span id="weapon-name">Pistol</span>
          <div class="cooldown-bar"><div id="cooldown-fill"></div></div>
        </div>
      </div>
    </div>

    <!-- ============ MAIN MENU ============ -->
    <div id="menu" class="overlay">
      <div class="menu-content">
        <h1 class="logo" aria-label="Neon Arena">
          <span>N</span><span>E</span><span>O</span><span>N</span><span class="logo-space"></span><span>A</span><span>R</span><span>E</span><span>N</span><span>A</span>
        </h1>
        <p class="tagline">Survive the swarm. Own the arena.</p>
        <button class="btn btn-play" id="btn-play">
          <svg class="ic" viewBox="0 0 24 24"><path d="M8 5v14l11-7z" fill="currentColor"/></svg>
          PLAY
        </button>
        <div class="menu-row">
          <button class="btn btn-ghost" id="btn-shop">
            <svg class="ic" viewBox="0 0 24 24"><path d="M7 18a2 2 0 100 4 2 2 0 000-4zm10 0a2 2 0 100 4 2 2 0 000-4zM7.2 14h9.9c.8 0 1.5-.5 1.8-1.2L21.6 6H6.2L5.3 3.6A1 1 0 004.4 3H2v2h1.6l3 9.2-1.1 2c-.5.9.1 2 1.2 2h12v-2H8.4l.8-1.5z" fill="currentColor" transform="translate(0,-1)"/></svg>
            Shop
          </button>
          <button class="btn btn-ghost" id="btn-settings">
            <svg class="ic" viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94s-.02-.64-.07-.94l2.03-1.58a.5.5 0 00.12-.64l-1.92-3.32a.5.5 0 00-.61-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.5.5 0 00-.5-.42h-3.84a.5.5 0 00-.5.42l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96a.5.5 0 00-.61.22L2.65 8.84a.5.5 0 00.12.64l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.5.5 0 00-.12.64l1.92 3.32c.13.22.39.31.61.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.25.42.5.42h3.84c.25 0 .45-.18.5-.42l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.09.48 0 .61-.22l1.92-3.32a.5.5 0 00-.12-.64l-2.03-1.58zM12 15.5A3.5 3.5 0 1112 8.5a3.5 3.5 0 010 7z" fill="currentColor"/></svg>
            Settings
          </button>
          <button class="btn btn-ghost" id="btn-sound-menu">
            <svg class="ic ic-on" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3z" fill="currentColor"/><path d="M16 8.5a4.5 4.5 0 010 7M18.5 6a8 8 0 010 12" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
            <svg class="ic ic-off" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3z" fill="currentColor"/><path d="M16 9l6 6M22 9l-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
            Sound
          </button>
        </div>
        <div class="menu-best">
          <span class="best-label">HIGH SCORE</span>
          <span id="menu-best">0</span>
        </div>
        <p class="howto">
          <kbd>WASD</kbd> / <kbd>←↑↓→</kbd> move &nbsp;·&nbsp; <kbd>MOUSE</kbd> aim &nbsp;·&nbsp; <kbd>CLICK</kbd> / <kbd>SPACE</kbd> shoot &nbsp;·&nbsp; <kbd>1-5</kbd> weapons &nbsp;·&nbsp; <kbd>P</kbd> pause
        </p>
      </div>
    </div>

    <!-- ============ SHOP ============ -->
    <div id="shop" class="overlay hidden">
      <div class="panel panel-shop">
        <div class="shop-head">
          <h2>SHOP</h2>
          <div class="shop-coins">
              <svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#ffd93d" stroke="#c77e00" stroke-width="2"/><path d="M12 7.2l1.35 2.85 3.1.4-2.25 2.15.55 3.05L12 14.2l-2.75 1.45.55-3.05-2.25-2.15 3.1-.4z" fill="#c77e00"/></svg>
              <span id="shop-coins">0</span>
            </div>
        </div>
        <div class="shop-tabs">
          <button class="shop-tab active" data-tab="weapons">Weapons</button>
          <button class="shop-tab" data-tab="skins">Skins</button>
          <button class="shop-tab" data-tab="upgrades">Upgrades</button>
        </div>
        <div class="shop-grid" id="shop-grid"></div>
        <button class="btn btn-ghost" id="btn-shop-back">Back</button>
      </div>
    </div>

    <!-- ============ SETTINGS ============ -->
    <div id="settings" class="overlay hidden">
      <div class="panel">
        <h2>SETTINGS</h2>
        <label class="toggle-row"><span>Sound</span><button class="toggle" id="tgl-sound" aria-label="Toggle sound"></button></label>
        <label class="toggle-row"><span>Screen shake</span><button class="toggle on" id="tgl-shake" aria-label="Toggle screen shake"></button></label>
        <label class="toggle-row"><span>Particles</span><button class="toggle on" id="tgl-particles" aria-label="Toggle particles"></button></label>
        <button class="btn btn-ghost" id="btn-reset-data">Reset all data</button>
        <button class="btn" id="btn-settings-back">Done</button>
      </div>
    </div>

    <!-- ============ PAUSE ============ -->
    <div id="pause" class="overlay hidden">
      <div class="panel">
        <h2>PAUSED</h2>
        <button class="btn" id="btn-resume">
          <svg class="ic" viewBox="0 0 24 24"><path d="M8 5v14l11-7z" fill="currentColor"/></svg>
          Resume
        </button>
        <button class="btn btn-ghost" id="btn-restart-pause">
          <svg class="ic" viewBox="0 0 24 24"><path d="M17.65 6.35A8 8 0 1 0 19.73 14h-2.08a6 6 0 1 1-1.41-6.24L13 11h7V4l-2.35 2.35z" fill="currentColor"/></svg>
          Restart
        </button>
        <button class="btn btn-ghost" id="btn-sound-pause">
          <svg class="ic ic-on" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3z" fill="currentColor"/><path d="M16 8.5a4.5 4.5 0 010 7M18.5 6a8 8 0 010 12" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
          <svg class="ic ic-off" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3z" fill="currentColor"/><path d="M16 9l6 6M22 9l-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          Sound
        </button>
        <button class="btn btn-ghost" id="btn-home-pause">
          <svg class="ic" viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z" fill="currentColor"/></svg>
          Home
        </button>
      </div>
    </div>

    <!-- ============ GAME OVER ============ -->
    <div id="gameover" class="overlay hidden">
      <div class="panel">
        <h2 class="go-title">GAME OVER</h2>
        <div id="new-best" class="new-best hidden">★ NEW BEST! ★</div>
        <div class="stats">
          <div class="stat"><span>Final Score</span><b id="go-score">0</b></div>
          <div class="stat"><span>Highest Score</span><b id="go-best">0</b></div>
          <div class="stat"><span>Wave Reached</span><b id="go-wave">1</b></div>
          <div class="stat"><span>Coins Earned</span><b id="go-coins">0</b></div>
        </div>
        <button class="btn" id="btn-again">
          <svg class="ic" viewBox="0 0 24 24"><path d="M8 5v14l11-7z" fill="currentColor"/></svg>
          Play Again
        </button>
        <div class="menu-row">
          <button class="btn btn-ghost" id="btn-shop-go">
            <svg class="ic" viewBox="0 0 24 24"><path d="M7 18a2 2 0 100 4 2 2 0 000-4zm10 0a2 2 0 100 4 2 2 0 000-4zM7.2 14h9.9c.8 0 1.5-.5 1.8-1.2L21.6 6H6.2L5.3 3.6A1 1 0 004.4 3H2v2h1.6l3 9.2-1.1 2c-.5.9.1 2 1.2 2h12v-2H8.4l.8-1.5z" fill="currentColor" transform="translate(0,-1)"/></svg>
            Shop
          </button>
          <button class="btn btn-ghost" id="btn-home-go">
            <svg class="ic" viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z" fill="currentColor"/></svg>
            Home
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="game.js"></script>
</body>
</html>
